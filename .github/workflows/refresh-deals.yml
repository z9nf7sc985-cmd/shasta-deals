name: Refresh deals JSON
on:
  push:
    paths: ['data/deals.csv','data/inbox/**','scripts/refresh-deals.js','.github/workflows/refresh-deals.yml']
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node scripts/refresh-deals.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/deals.json
          git diff --staged --quiet || (git commit -m 'chore: refresh deals.json' && git push)
